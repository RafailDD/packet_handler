name: CI Pipeline

on:
  push:
    branches: [ "main", "jules-experimenting" ]
  pull_request:
    branches: [ "main", "jules-experimenting" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies (iverilog, verilator)
      run: |
        sudo apt-get update
        sudo apt-get install -y iverilog verilator

    - name: Install Python dependencies (cocotb, pytest)
      run: |
        python -m pip install --upgrade pip
        pip install cocotb pytest==8.0.0

    - name: Lint RTL Code
      run: |
        verilator --lint-only -Wall packet_handler.v

    - name: Run Cocotb Flow
      run: |
        make cocotb

    - name: Run Standalone SystemVerilog Testbench (Icarus Verilog)
      run: |
        make icarus

    - name: Run Pure UVM-Style SV Testbench (Verilator)
      run: |
        make verilator

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build Xezim Simulator
      run: |
        cd ..
        git clone https://github.com/aionhw/xezim-core.git
        git clone https://github.com/aionhw/xezim.git
        cd xezim
        cargo build --release

    - name: Run Standard UVM Testbench (Xezim)
      run: |
        export PATH="$GITHUB_WORKSPACE/../xezim/target/release:$PATH"
        make xezim_uvm
